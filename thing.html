<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki Speedun</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f1117; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; }

    /* HUD */
    #hud { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #1a1d27; border-bottom: 2px solid #2e3250; flex-shrink: 0; flex-wrap: wrap; }
    #hud .logo { font-size: 1.2rem; font-weight: 800; color: #7c8ffc; letter-spacing: 1px; }
    .hud-card { background: #12151f; border: 1px solid #2e3250; border-radius: 8px; padding: 6px 14px; display: flex; flex-direction: column; align-items: center; min-width: 90px; }
    .hud-card .label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: #7a7f9a; }
    .hud-card .value { font-size: 1.3rem; font-weight: 700; color: #e0e4ff; }
    #timer-val { color: #5de4a8; }
    #clicks-val { color: #ffc35d; }
    .target-card { background: #12151f; border: 1px solid #2e3250; border-radius: 8px; padding: 6px 14px; flex: 1; min-width: 160px; }
    .target-card .label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: #7a7f9a; }
    .target-card .value { font-size: 1rem; font-weight: 600; color: #ff7eb3; }
    .current-card .value { color: #7c8ffc; }
    #btn-new { margin-left: auto; background: #3b4ac8; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    #btn-new:hover { background: #5563e8; }

    /* Breadcrumb */
    #breadcrumb { padding: 6px 20px; font-size: 0.78rem; color: #7a7f9a; background: #13161f; border-bottom: 1px solid #1e2135; overflow-x: auto; white-space: nowrap; flex-shrink: 0; }
    #breadcrumb span { color: #7c8ffc; cursor: pointer; }
    #breadcrumb span:hover { text-decoration: underline; }

    /* Article */
    #article-wrap { flex: 1; overflow-y: auto; padding: 24px 40px; max-width: 900px; width: 100%; margin: 0 auto; }
    #loading { text-align: center; margin-top: 80px; font-size: 1.1rem; color: #5a6080; display: none; }
    #loading .spinner { width: 40px; height: 40px; border: 4px solid #2e3250; border-top-color: #7c8ffc; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #article-content h1 { font-size: 2rem; margin-bottom: 6px; color: #dde2ff; }
    #article-content h2 { font-size: 1.4rem; margin: 22px 0 8px; color: #c4caff; border-bottom: 1px solid #2e3250; padding-bottom: 4px; }
    #article-content h3 { font-size: 1.1rem; margin: 16px 0 6px; color: #b4baef; }
    #article-content p { line-height: 1.7; margin-bottom: 12px; color: #cdd2ea; }
    #article-content a { color: #7baef7; text-decoration: none; cursor: pointer; }
    #article-content a:hover { color: #a8c8ff; text-decoration: underline; }
    #article-content ul, #article-content ol { margin: 0 0 12px 24px; }
    #article-content li { line-height: 1.7; color: #cdd2ea; }
    #article-content table { border-collapse: collapse; margin-bottom: 14px; font-size: 0.88rem; max-width: 100%; }
    #article-content th, #article-content td { border: 1px solid #2e3250; padding: 6px 10px; color: #cdd2ea; }
    #article-content th { background: #1a1d2e; color: #a0a8d0; }
    #article-content img { max-width: 100%; border-radius: 6px; margin: 8px 0; opacity: 0.9; }
    #article-content .hatnote, #article-content .dablink { font-style: italic; color: #7a7f9a; border-left: 3px solid #2e3250; padding-left: 10px; margin-bottom: 10px; }
    #article-content sup { font-size: 0.7em; }
    #article-content sup a { color: #5a6fa0; }

    /* Setup */
    #setup-screen { position: fixed; inset: 0; background: #0c0e16; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .setup-box { background: #1a1d27; border: 1px solid #2e3250; border-radius: 16px; padding: 40px 48px; width: 520px; max-width: 95vw; }
    .setup-box h1 { font-size: 2rem; color: #7c8ffc; margin-bottom: 6px; }
    .setup-box .sub { color: #7a7f9a; margin-bottom: 30px; font-size: 0.95rem; }
    .setup-box label { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #7a7f9a; margin-bottom: 6px; margin-top: 18px; }
    .ac-wrap { position: relative; }
    .ac-wrap input {
      width: 100%; background: #12151f; border: 1px solid #2e3250; border-radius: 8px;
      color: #e0e4ff; padding: 10px 14px; font-size: 1rem; outline: none;
    }
    .ac-wrap input:focus { border-color: #7c8ffc; }

    .setup-row { display: flex; gap: 12px; margin-top: 28px; }
    .setup-row button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; }
    #btn-random { background: #232640; color: #7c8ffc; border: 1px solid #3b4ac8; }
    #btn-random:hover { background: #2e3360; }
    #btn-start { background: #3b4ac8; color: #fff; }
    #btn-start:hover { background: #5563e8; }
    .presets { margin-top: 20px; font-size: 0.82rem; color: #5a6080; }
    .presets span { color: #5a7fc8; cursor: pointer; margin-right: 8px; }
    .presets span:hover { color: #7c9fe8; text-decoration: underline; }
    #error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }

    /* Win */
    #win-overlay { position: fixed; inset: 0; background: rgba(10,12,20,0.9); display: none; align-items: center; justify-content: center; z-index: 200; }
    .win-box { background: #1a1d27; border: 2px solid #5de4a8; border-radius: 16px; padding: 40px 52px; text-align: center; max-width: 420px; }
    .win-box .trophy { font-size: 3.5rem; }
    .win-box h2 { font-size: 1.8rem; color: #5de4a8; margin: 14px 0 6px; }
    .win-box .stats { font-size: 1.1rem; color: #c0c6e8; margin: 16px 0 26px; line-height: 2; }
    .win-box .stats b { color: #ffc35d; }
    .win-box button { background: #3b4ac8; color: #fff; border: none; border-radius: 8px; padding: 12px 30px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .win-box button:hover { background: #5563e8; }
  </style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-box">
    <h1>⚡ Wiki Speedrun</h1>
    <p class="sub">Navigate Wikipedia links to reach the target article as fast as possible.</p>

    <label>Start Article</label>
    <div class="ac-wrap">
      <input type="text" id="inp-start" placeholder="e.g. Banana" list="dl-start" />
      <datalist id="dl-start"></datalist>
    </div>

    <label>Target Article</label>
    <div class="ac-wrap">
      <input type="text" id="inp-target" placeholder="e.g. Albert Einstein" list="dl-target" />
      <datalist id="dl-target"></datalist>
    </div>

    <div id="error-msg"></div>
    <div class="setup-row">
      <button id="btn-random">🎲 Random</button>
      <button id="btn-start">▶ Start Game</button>
    </div>
    <div class="presets">
      Quick picks:
      <span onclick="setPreset('Banana','Adolf Hitler')">Banana → Hitler</span>
      <span onclick="setPreset('Spoon','Philosophy')">Spoon → Philosophy</span>
      <span onclick="setPreset('Pizza','Mathematics')">Pizza → Math</span>
      <span onclick="setPreset('Cat','Internet')">Cat → Internet</span>
    </div>
  </div>
</div>

<div id="hud">
  <div class="logo">⚡ WIKI SPEEDRUN</div>
  <div class="hud-card"><div class="label">Time</div><div class="value" id="timer-val">0:00</div></div>
  <div class="hud-card"><div class="label">Clicks</div><div class="value" id="clicks-val">0</div></div>
  <div class="target-card current-card"><div class="label">Current</div><div class="value" id="current-title">—</div></div>
  <div class="target-card"><div class="label">🎯 Target</div><div class="value" id="target-title">—</div></div>
  <button id="btn-new">New Game</button>
</div>

<div id="breadcrumb">Path: <span id="path-list"></span></div>

<div id="article-wrap">
  <div id="loading"><div class="spinner"></div>Loading article…</div>
  <div id="article-content"></div>
</div>

<div id="win-overlay">
  <div class="win-box">
    <div class="trophy">🏆</div>
    <h2>You Made It!</h2>
    <div class="stats" id="win-stats"></div>
    <button onclick="newGame()">Play Again</button>
  </div>
</div>

<script>
  /* ── Game state ── */
  let startArticle = '', targetArticle = '';
  let clicks = 0, seconds = 0;
  let timerInterval = null, running = false;
  let path = [];

  const timerEl    = document.getElementById('timer-val');
  const clicksEl   = document.getElementById('clicks-val');
  const currentEl  = document.getElementById('current-title');
  const targetEl   = document.getElementById('target-title');
  const pathEl     = document.getElementById('path-list');
  const content    = document.getElementById('article-content');
  const loading    = document.getElementById('loading');
  const setup      = document.getElementById('setup-screen');
  const winOverlay = document.getElementById('win-overlay');
  const winStats   = document.getElementById('win-stats');
  const errMsg     = document.getElementById('error-msg');

  /* ── Timer ── */
  function startTimer() {
    clearInterval(timerInterval); seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = `${Math.floor(seconds/60)}:${(seconds%60).toString().padStart(2,'0')}`;
    }, 1000);
  }
  function stopTimer() { clearInterval(timerInterval); }
  function formatTime(s) { return `${Math.floor(s/60)}m ${s%60}s`; }

  /* ── Wikipedia fetch ── */
  async function fetchArticle(title) {
    loading.style.display = 'block'; content.innerHTML = '';
    try {
      const res = await fetch(`https://en.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=text|displaytitle&format=json&origin=*`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.info);
      return data.parse;
    } catch(e) {
      loading.style.display = 'none';
      content.innerHTML = `<p style="color:#ff6b6b">Could not load article: ${e.message}</p>`;
      return null;
    }
  }

  function applyArticle(data) {
    const realTitle = data.title;
    currentEl.textContent = realTitle;
    content.innerHTML = `<h1>${data.displaytitle || realTitle}</h1>` + data.text['*'];
    loading.style.display = 'none';
    content.querySelectorAll('.mw-editsection,.navbox,.vertical-navbox,#toc,.toc,.mw-empty-elt').forEach(el => el.remove());
    content.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (href && href.startsWith('/wiki/') && !href.includes(':')) {
        const linked = decodeURIComponent(href.replace('/wiki/','').replace(/_/g,' '));
        a.href = '#'; a.onclick = e => { e.preventDefault(); handleClick(linked); };
      } else {
        a.href = '#'; a.onclick = e => e.preventDefault();
        a.style.color = '#4a5070'; a.style.cursor = 'default';
      }
    });
    content.querySelectorAll('img[src]').forEach(img => {
      const src = img.getAttribute('src');
      if (src && src.startsWith('//')) img.src = 'https:' + src;
    });
    document.getElementById('article-wrap').scrollTop = 0;
    return realTitle;
  }

  function normalise(s) { return s.toLowerCase().replace(/_/g,' ').trim(); }

  function handleClick(title) {
    if (!running) return;
    clicks++; clicksEl.textContent = clicks;
    goToArticle(title);
  }

  async function goToArticle(title, addToPath = true) {
    const data = await fetchArticle(title);
    if (!data) return;
    const realTitle = applyArticle(data);
    if (addToPath) { path.push(realTitle); renderPath(); }
    if (running && normalise(realTitle) === normalise(targetArticle)) win();
  }

  function renderPath() {
    pathEl.innerHTML = path.map((t, i) =>
      i === path.length - 1
        ? `<b style="color:#dde2ff">${t}</b>`
        : `<span onclick="jumpBack(${i})">${t}</span>`
    ).join(' → ');
  }

  function jumpBack(idx) {
    if (!running) return;
    path = path.slice(0, idx + 1); clicks++; clicksEl.textContent = clicks;
    goToArticle(path[path.length - 1], false); renderPath();
  }

  function win() {
    running = false; stopTimer();
    winStats.innerHTML = `Time: <b>${formatTime(seconds)}</b><br>Clicks: <b>${clicks}</b><br>Path length: <b>${path.length} articles</b>`;
    winOverlay.style.display = 'flex';
  }

  async function startGame() {
    errMsg.textContent = '';
    const s = document.getElementById('inp-start').value.trim();
    const t = document.getElementById('inp-target').value.trim();
    if (!s || !t) { errMsg.textContent = 'Please enter both a start and target article.'; return; }
    if (normalise(s) === normalise(t)) { errMsg.textContent = 'Start and target must be different!'; return; }
    startArticle = s; targetArticle = t;
    clicks = 0; clicksEl.textContent = '0'; timerEl.textContent = '0:00'; path = [];
    targetEl.textContent = targetArticle;
    setup.style.display = 'none'; winOverlay.style.display = 'none';
    const data = await fetchArticle(startArticle);
    if (!data) { setup.style.display = 'flex'; errMsg.textContent = 'Start article not found on Wikipedia.'; return; }
    running = true; startTimer();
    const realTitle = applyArticle(data);
    path.push(realTitle); renderPath();
    if (normalise(realTitle) === normalise(targetArticle)) win();
  }

  function newGame() {
    running = false; stopTimer();
    winOverlay.style.display = 'none'; setup.style.display = 'flex';
    content.innerHTML = ''; path = []; renderPath();
  }

  function setPreset(s, t) {
    document.getElementById('inp-start').value = s;
    document.getElementById('inp-target').value = t;
    closeAllDropdowns();
  }

  /* ── Article pool ── */

  /* ── Autocomplete via native <datalist> ── */
  const acTimers = {};

  function fillDatalist(datalistId, titles) {
    const dl = document.getElementById(datalistId);
    dl.innerHTML = titles.map(t => `<option value="${t.replace(/"/g,'&quot;')}"></option>`).join('');
  }

  function setupAutocomplete(inputId, datalistId) {
    const inp = document.getElementById(inputId);

    inp.addEventListener('input', () => {
      const q = inp.value.trim();
      if (!q) { fillDatalist(datalistId, []); return; }

      // Instant local matches
      const local = RANDOM_ARTICLES
        .filter(a => a.toLowerCase().includes(q.toLowerCase()))
        .slice(0, 8);
      fillDatalist(datalistId, local);

      // Debounced Wikipedia opensearch to add extra results
      clearTimeout(acTimers[inputId]);
      acTimers[inputId] = setTimeout(async () => {
        try {
          const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=8&format=json&origin=*`;
          const res = await fetch(url);
          const [, titles] = await res.json();
          const localSet = new Set(local.map(x => x.toLowerCase()));
          const merged = [...local, ...titles.filter(t => !localSet.has(t.toLowerCase()))].slice(0, 12);
          fillDatalist(datalistId, merged);
        } catch {}
      }, 300);
    });

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') startGame();
    });
  }

  setupAutocomplete('inp-start', 'dl-start');
  setupAutocomplete('inp-target', 'dl-target');

  function closeAllDropdowns() {}

  /* ── Buttons ── */
  document.getElementById('btn-random').onclick = () => {
    const pool = [...RANDOM_ARTICLES];
    const si = Math.floor(Math.random() * pool.length);
    const s = pool.splice(si, 1)[0];
    const t = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('inp-start').value = s;
    document.getElementById('inp-target').value = t;
    closeAllDropdowns();
  };
  document.getElementById('btn-start').onclick = startGame;
